<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etranquiem • Reqium</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background-color: #030204;
            color: #f1f1f5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 24px;
        }

        /* Ambient Glow Scaled Up to Match Content */
        .ambient-glow {
            position: absolute;
            width: 420px;
            height: 420px;
            background: radial-gradient(circle, rgba(115, 35, 75, 0.08) 0%, rgba(20, 10, 30, 0.03) 50%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 1;
        }

        /* Centered Content Wrapper */
        .content {
            position: relative;
            z-index: 2;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Avatar Scaled Up Proportionately */
        .avatar-wrap {
            width: 140px;
            height: 140px;
            margin-bottom: 30px;
        }

        .avatar-wrap img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid rgba(175, 80, 120, 0.15);
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.95);
            filter: brightness(0.9) contrast(1.05);
        }

        /* Typography Scaled Up Proportionately */
        h1 {
            font-size: 2.7rem;
            font-weight: 600;
            letter-spacing: -0.8px;
            color: #ffffff;
            margin-bottom: 6px;
        }

        .handle {
            font-size: 1.15rem;
            font-weight: 400;
            color: #8c4a6b; /* Slightly deeper pink accent */
            margin-bottom: 10px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        }

        .subtitle {
            font-size: 1.2rem;
            font-weight: 400;
            color: #71717a;
            margin-bottom: 36px;
        }

        /* Site Status Badge - Scaled & Deeper Pink Tone */
        .status-badge {
            font-size: 1rem;
            color: #b8658d; /* Darkened pink tone */
            background: rgba(28, 10, 20, 0.65);
            border: 1px solid rgba(145, 50, 95, 0.25);
            padding: 10px 26px;
            border-radius: 30px;
            backdrop-filter: blur(10px);
            letter-spacing: 0.3px;
        }

        /* Fixed Bottom Right Copyright */
        footer {
            position: absolute;
            bottom: 24px;
            right: 24px;
            font-size: 0.85rem;
            color: #3f3f46;
            letter-spacing: 0.5px;
            z-index: 2;
        }

        @media (max-width: 600px) {
            footer {
                position: static;
                margin-top: 48px;
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <div class="ambient-glow"></div>

    <div class="content">
        <div class="avatar-wrap">
            <img src="avatar.jpg" alt="Reqium Avatar">
        </div>

        <h1>Reqium</h1>
        <div class="handle">@etranquiem</div>
        <div class="subtitle">3D Modeler & Animator</div>

        <div class="status-badge">
            Site is in progress
        </div>
    </div>

    <footer>
        © Etranquiem. All rights reserved.
    </footer>

</body>
</html>
