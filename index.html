<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ETRANQUIEM | Req</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #050505;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        #bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0.45;
        }
        .card {
            position: relative;
            z-index: 2;
            width: 90%;
            max-width: 500px;
            background: rgba(18, 18, 20, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 36px 28px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
        }
        .status-badge {
            display: inline-block;
            font-size: 0.75rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 6px 14px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #888;
            margin-bottom: 24px;
        }
        .status-badge span {
            color: #ff4757;
            margin-right: 6px;
        }
        h1 {
            font-size: 2.2rem;
            font-weight: 300;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        .tagline {
            font-size: 0.9rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 24px;
        }
        .quote {
            font-size: 0.95rem;
            font-style: italic;
            color: #bbb;
            line-height: 1.6;
            margin-bottom: 28px;
            padding: 0 10px;
            border-left: 2px solid rgba(255, 255, 255, 0.3);
            text-align: left;
        }
        .links {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            text-decoration: none;
            color: #fff;
            font-size: 0.85rem;
            padding: 10px 20px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.3s ease;
        }
        .btn:hover {
            background: #ffffff;
            color: #000000;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <div class="card">
        <div class="status-badge"><span>●</span> Offline / Building</div>
        <h1>REQ</h1>
        <p class="tagline">Animator & 3D Modeler</p>
        
        <div class="quote">
            "We buy things we don't need with money we don't have to impress people we don't like."
        </div>

        <div class="links">
            <a href="https://discord.com" target="_blank" class="btn">Discord</a>
            <a href="mailto:your-email@gmail.com" class="btn">Contact</a>
        </div>
    </div>

    <script>
        // Simple Three.js Wireframe Sphere Scene
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('bg-canvas'), alpha: true });
        
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);

        const geometry = new THREE.IcosahedronGeometry(10, 2);
        const material = new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true, transparent: true, opacity: 0.15 });
        const sphere = new THREE.Mesh(geometry, material);
        scene.add(sphere);

        camera.position.z = 18;

        // Mouse interaction
        let mouseX = 0, mouseY = 0;
        document.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX - window.innerWidth / 2) * 0.0005;
            mouseY = (e.clientY - window.innerHeight / 2) * 0.0005;
        });

        function animate() {
            requestAnimationFrame(animate);
            sphere.rotation.x += 0.002 + mouseY * 0.1;
            sphere.rotation.y += 0.003 + mouseX * 0.1;
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
