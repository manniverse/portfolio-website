<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etranquiem • Reqium</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background-color: #030204;
            color: #f1f1f5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 24px;
        }

        /* Subtle Ambient Glow Matching Pink Panther Tones */
        .ambient-glow {
            position: absolute;
            width: 320px;
            height: 320px;
            background: radial-gradient(circle, rgba(140, 45, 95, 0.08) 0%, rgba(20, 10, 30, 0.04) 50%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 1;
        }

        /* Centered Content Wrapper */
        .content {
            position: relative;
            z-index: 2;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Profile Avatar Frame */
        .avatar-wrap {
            width: 104px;
            height: 104px;
            margin-bottom: 24px;
        }

        .avatar-wrap img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid rgba(216, 112, 147, 0.15);
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.9);
            filter: brightness(0.9) contrast(1.05);
        }

        /* Typography */
        h1 {
            font-size: 2rem;
            font-weight: 600;
            letter-spacing: -0.5px;
            color: #ffffff;
            margin-bottom: 4px;
        }

        .handle {
            font-size: 0.9rem;
            font-weight: 400;
            color: #a36283;
            margin-bottom: 8px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        }

        .subtitle {
            font-size: 0.95rem;
            font-weight: 400;
            color: #71717a;
            margin-bottom: 28px;
        }

        /* Site Status Badge - Darkened Pink Panther Accent */
        .status-badge {
            font-size: 0.8rem;
            color: #d881ab;
            background: rgba(35, 12, 25, 0.6);
            border: 1px solid rgba(180, 70, 120, 0.25);
            padding: 8px 20px;
            border-radius: 30px;
            backdrop-filter: blur(10px);
            letter-spacing: 0.3px;
        }

        /* Fixed Bottom Right Copyright */
        footer {
            position: absolute;
            bottom: 24px;
            right: 24px;
            font-size: 0.75rem;
            color: #3f3f46;
            letter-spacing: 0.5px;
            z-index: 2;
        }

        @media (max-width: 600px) {
            footer {
                position: static;
                margin-top: 40px;
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <div class="ambient-glow"></div>

    <div class="content">
        <div class="avatar-wrap">
            <img src="avatar.jpg" alt="Reqium Avatar">
        </div>

        <h1>Reqium</h1>
        <div class="handle">@etranquiem</div>
        <div class="subtitle">3D Modeler & Animator</div>

        <div class="status-badge">
            Site is in progress
        </div>
    </div>

    <footer>
        © Etranquiem. All rights reserved.
    </footer>

</body>
</html>
