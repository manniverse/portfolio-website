<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etranquiem • Reqium</title>
    <style>
        :root {
            --bg: #0a0a0a;
            --card-bg: #121212;
            --border: #222222;
            --text-primary: #ffffff;
            --text-secondary: #888888;
            --text-muted: #555555;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background-color: var(--bg);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 24px;
        }

        /* Centered Modern Card */
        .card {
            width: 100%;
            max-width: 400px;
            padding: 48px 36px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        }

        /* Profile Avatar Frame */
        .avatar-wrap {
            width: 100px;
            height: 100px;
            margin: 0 auto 24px;
        }

        .avatar-wrap img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid var(--border);
        }

        /* Clean Modern Typography */
        h1 {
            font-size: 1.75rem;
            font-weight: 600;
            letter-spacing: -0.5px;
            color: var(--text-primary);
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 0.95rem;
            font-weight: 400;
            color: var(--text-secondary);
            margin-bottom: 28px;
        }

        /* Site Status Badge */
        .status-badge {
            display: inline-block;
            font-size: 0.85rem;
            color: var(--text-secondary);
            background: #181818;
            border: 1px solid var(--border);
            padding: 8px 20px;
            border-radius: 30px;
        }

        /* Bottom Right Copyright */
        footer {
            position: absolute;
            bottom: 24px;
            right: 24px;
            font-size: 0.75rem;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }

        @media (max-width: 600px) {
            footer {
                position: static;
                margin-top: 32px;
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="avatar-wrap">
            <img src="1010635972622519810.jpg" alt="Reqium Avatar">
        </div>

        <h1>Reqium</h1>
        <div class="subtitle">3D Modeler & Animator</div>

        <div class="status-badge">
            Site is in progress
        </div>
    </div>

    <footer>
        © Etranquiem. All rights reserved.
    </footer>

</body>
</html>
