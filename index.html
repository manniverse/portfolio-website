<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etranquiem • Reqium</title>
    <style>
        :root {
            --bg: #050507;
            --card-bg: rgba(12, 12, 15, 0.7);
            --border: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(255, 255, 255, 0.2);
            --text-primary: #f1f5f9;
            --text-secondary: #888888;
            --text-muted: #444444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background-color: var(--bg);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Subdued Tech Grid Background */
        .grid-bg {
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.015) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: 1;
        }

        /* Moonlight Cursor Glow Effect */
        .spotlight {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: radial-gradient(600px circle at var(--x, 50%) var(--y, 50%), rgba(255, 255, 255, 0.03), transparent 60%);
            z-index: 2;
        }

        /* HUD Corner Brackets */
        .corner {
            position: absolute;
            width: 16px;
            height: 16px;
            border: 1px solid var(--text-muted);
            opacity: 0.4;
            z-index: 5;
        }
        .top-left { top: 24px; left: 24px; border-right: none; border-bottom: none; }
        .top-right { top: 24px; right: 24px; border-left: none; border-bottom: none; }
        .bottom-left { bottom: 24px; left: 24px; border-right: none; border-top: none; }
        .bottom-right { bottom: 24px; right: 24px; border-left: none; border-top: none; }

        /* Centered Stealth Card Container */
        .card {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 420px;
            padding: 40px 32px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.9);
            transition: border-color 0.4s ease;
        }

        .card:hover {
            border-color: var(--border-hover);
        }

        /* Profile Avatar Frame */
        .avatar-wrap {
            position: relative;
            width: 108px;
            height: 108px;
            margin: 0 auto 24px;
        }

        .avatar-wrap img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid var(--border);
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
        }

        /* Mixed-Case Typography */
        h1 {
            font-size: 1.8rem;
            font-weight: 600;
            letter-spacing: -0.5px;
            color: var(--text-primary);
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 0.9rem;
            font-weight: 400;
            color: var(--text-secondary);
            margin-bottom: 24px;
        }

        /* Status Badge */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 0.75rem;
            color: var(--text-secondary);
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border);
            padding: 8px 18px;
            border-radius: 20px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background-color: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 8px #ffffff;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.2; }
            50% { opacity: 0.9; }
        }

        /* Domain Footer Anchor */
        .brand-footer {
            margin-top: 28px;
            font-size: 0.75rem;
            color: var(--text-muted);
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="grid-bg"></div>
    <div class="spotlight" id="spotlight"></div>

    <div class="corner top-left"></div>
    <div class="corner top-right"></div>
    <div class="corner bottom-left"></div>
    <div class="corner bottom-right"></div>

    <div class="card">
        <div class="avatar-wrap">
            <img src="1010635972622519810.jpg" alt="Reqium Avatar">
        </div>

        <h1>Reqium</h1>
        <div class="subtitle">3D Modeler & Animator</div>

        <div class="status-badge">
            <span class="status-dot"></span>
            <span>Site under progress</span>
        </div>

        <div class="brand-footer">
            etranquiem.com
        </div>
    </div>

    <script>
        const spotlight = document.getElementById('spotlight');
        window.addEventListener('mousemove', (e) => {
            spotlight.style.setProperty('--x', `${e.clientX}px`);
            spotlight.style.setProperty('--y', `${e.clientY}px`);
        });
    </script>
</body>
</html>
