<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ETRANQUIEM // REQIUM</title>
    <style>
        :root {
            --bg: #050505;
            --border: #262626;
            --text-main: #ffffff;
            --text-dim: #666666;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px;
            position: relative;
        }

        /* Tech Grid Background */
        .grid-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            z-index: 1;
        }

        /* Spotlight Cursor Glow */
        .spotlight {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: radial-gradient(800px circle at var(--x, 50%) var(--y, 50%), rgba(255, 255, 255, 0.06), transparent 40%);
            z-index: 2;
        }

        /* Tactical HUD Corner Brackets */
        .hud-corner {
            position: absolute;
            width: 24px;
            height: 24px;
            border: 1px solid var(--text-dim);
            z-index: 5;
            opacity: 0.4;
        }
        .top-left { top: 20px; left: 20px; border-right: none; border-bottom: none; }
        .top-right { top: 20px; right: 20px; border-left: none; border-bottom: none; }
        .bottom-left { bottom: 20px; left: 20px; border-right: none; border-top: none; }
        .bottom-right { bottom: 20px; right: 20px; border-left: none; border-top: none; }

        /* Navigation Header */
        header {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            font-size: 0.9rem;
            font-weight: 800;
            letter-spacing: 5px;
            text-transform: uppercase;
        }

        .status {
            font-family: monospace;
            font-size: 0.75rem;
            letter-spacing: 2px;
            color: var(--text-dim);
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid var(--border);
            padding: 8px 16px;
            background: rgba(0, 0, 0, 0.5);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background-color: #fff;
            border-radius: 50%;
            box-shadow: 0 0 10px #fff;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.2; }
            50% { opacity: 1; }
        }

        /* Centered Hero Content */
        main {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin: auto;
        }

        /* Profile Picture Ring */
        .pfp-container {
            position: relative;
            width: 130px;
            height: 130px;
            border-radius: 50%;
            padding: 4px;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.02);
            margin-bottom: 28px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
        }

        .pfp-container img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            filter: grayscale(100%) contrast(110%);
        }

        .name {
            font-size: clamp(2.5rem, 6vw, 4.5rem);
            font-weight: 900;
            letter-spacing: 6px;
            text-transform: uppercase;
            line-height: 1;
            margin-bottom: 12px;
            background: linear-gradient(180deg, #FFFFFF 0%, #444444 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .role {
            font-family: monospace;
            font-size: 0.85rem;
            letter-spacing: 4px;
            color: var(--text-dim);
            text-transform: uppercase;
            margin-bottom: 24px;
        }

        .progress-tag {
            font-family: monospace;
            font-size: 0.75rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 10px 24px;
            background: rgba(255, 255, 255, 0.02);
        }

        /* Footer */
        footer {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            font-family: monospace;
            font-size: 0.75rem;
            color: var(--text-dim);
            letter-spacing: 2px;
        }

        @media (max-width: 768px) {
            body { padding: 24px; }
            footer { flex-direction: column; gap: 12px; text-align: center; }
        }
    </style>
</head>
<body>

    <div class="grid-bg"></div>
    <div class="spotlight" id="spotlight"></div>

    <div class="hud-corner top-left"></div>
    <div class="hud-corner top-right"></div>
    <div class="hud-corner bottom-left"></div>
    <div class="hud-corner bottom-right"></div>

    <header>
        <div class="brand">ETRANQUIEM</div>
        <div class="status">
            <div class="status-dot"></div>
            IN PROGRESS
        </div>
    </header>

    <main>
        <div class="pfp-container">
            <!-- Replace avatar.jpg with your image file path if hosted in repo -->
            <img src="https://github.com/manniverse.png" alt="Reqium Avatar">
        </div>

        <h1 class="name">REQIUM</h1>
        <div class="role">3D MODELER & ANIMATOR</div>
        <div class="progress-tag">/// SITE UNDER PROGRESS ///</div>
    </main>

    <footer>
        <div>ETRANQUIEM.COM</div>
        <div>SYSTEM // ONLINE</div>
    </footer>

    <script>
        const spotlight = document.getElementById('spotlight');
        window.addEventListener('mousemove', (e) => {
            spotlight.style.setProperty('--x', `${e.clientX}px`);
            spotlight.style.setProperty('--y', `${e.clientY}px`);
        });
    </script>
</body>
</html>
