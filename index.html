<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ETRANQUIEM // REQIUM</title>
    <style>
        :root {
            --bg: #030304;
            --border: #1a1a1a;
            --text-main: #e5e5e5;
            --text-dim: #444444;
            --text-muted: #222222;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px;
            position: relative;
        }

        /* Darker, Subdued Grid Background */
        .grid-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.015) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
            background-size: 60px 60px;
            z-index: 1;
        }

        /* Subtle Dynamic Spotlight */
        .spotlight {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: radial-gradient(700px circle at var(--x, 50%) var(--y, 50%), rgba(255, 255, 255, 0.025), transparent 50%);
            z-index: 2;
        }

        /* HUD Corner Brackets */
        .hud-corner {
            position: absolute;
            width: 20px;
            height: 20px;
            border: 1px solid var(--border);
            z-index: 5;
            opacity: 0.6;
        }
        .top-left { top: 20px; left: 20px; border-right: none; border-bottom: none; }
        .top-right { top: 20px; right: 20px; border-left: none; border-bottom: none; }
        .bottom-left { bottom: 20px; left: 20px; border-right: none; border-top: none; }
        .bottom-right { bottom: 20px; right: 20px; border-left: none; border-top: none; }

        /* Navigation Header */
        header {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            font-size: 0.85rem;
            font-weight: 800;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: #888888;
        }

        .status {
            font-family: monospace;
            font-size: 0.7rem;
            letter-spacing: 2px;
            color: var(--text-dim);
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid var(--border);
            padding: 6px 14px;
            background: rgba(0, 0, 0, 0.6);
        }

        .status-dot {
            width: 5px;
            height: 5px;
            background-color: #888;
            border-radius: 50%;
            box-shadow: 0 0 6px #888;
            animation: pulse 2.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.2; }
            50% { opacity: 0.9; }
        }

        /* Centered Hero Card & Content */
        main {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin: auto;
            max-width: 600px;
            width: 100%;
        }

        /* Profile Picture Ring */
        .pfp-container {
            position: relative;
            width: 110px;
            height: 110px;
            border-radius: 50%;
            padding: 3px;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.01);
            margin-bottom: 24px;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.9);
        }

        .pfp-container img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            filter: grayscale(100%) contrast(120%) brightness(85%);
        }

        .meta-tag {
            font-family: monospace;
            font-size: 0.75rem;
            letter-spacing: 3px;
            color: var(--text-dim);
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .name {
            font-size: clamp(2.5rem, 5vw, 4.2rem);
            font-weight: 900;
            letter-spacing: 4px;
            text-transform: uppercase;
            line-height: 1;
            margin-bottom: 12px;
            background: linear-gradient(180deg, #CCCCCC 0%, #222222 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .role {
            font-family: monospace;
            font-size: 0.8rem;
            letter-spacing: 3px;
            color: #666666;
            text-transform: uppercase;
            margin-bottom: 32px;
        }

        /* Sleek Status Box */
        .progress-box {
            font-family: monospace;
            font-size: 0.75rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #a3a3a3;
            border: 1px solid var(--border);
            padding: 12px 28px;
            background: rgba(10, 10, 12, 0.7);
            backdrop-filter: blur(8px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        /* Footer */
        footer {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            font-family: monospace;
            font-size: 0.7rem;
            color: var(--text-dim);
            letter-spacing: 2px;
        }

        @media (max-width: 768px) {
            body { padding: 24px; }
            footer { flex-direction: column; gap: 8px; text-align: center; }
        }
    </style>
</head>
<body>

    <div class="grid-bg"></div>
    <div class="spotlight" id="spotlight"></div>

    <div class="hud-corner top-left"></div>
    <div class="hud-corner top-right"></div>
    <div class="hud-corner bottom-left"></div>
    <div class="hud-corner bottom-right"></div>

    <header>
        <div class="brand">ETRANQUIEM</div>
        <div class="status">
            <div class="status-dot"></div>
            SYS.LOC // OFFLINE
        </div>
    </header>

    <main>
        <div class="pfp-container">
            <img src="https://github.com/manniverse.png" alt="Reqium Avatar">
        </div>

        <div class="meta-tag">/// IDENTITY</div>
        <h1 class="name">REQIUM</h1>
        <div class="role">3D MODELER & ANIMATOR</div>

        <div class="progress-box">SITE UNDER PROGRESS</div>
    </main>

    <footer>
        <div>ETRANQUIEM.COM</div>
        <div>STATION // ONLINE</div>
    </footer>

    <script>
        const spotlight = document.getElementById('spotlight');
        window.addEventListener('mousemove', (e) => {
            spotlight.style.setProperty('--x', `${e.clientX}px`);
            spotlight.style.setProperty('--y', `${e.clientY}px`);
        });
    </script>
</body>
</html>
